name: Restore audit web source
on:
  push:
    branches:
      - feat/pgs-audit-ux-uat
    paths:
      - .github/workflows/restore-audit-web.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore only vetted frontend source files from archived ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          src = Path('web.zip')
          if not src.is_file():
              raise SystemExit('Missing web.zip in feature branch')
          restored = []
          with ZipFile(src) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  p = info.filename.replace('\\', '/')
                  path = Path(p)
                  if not p.startswith('apps/web/') or '..' in path.parts or path.is_absolute() or not p.endswith(('.ts', '.tsx')):
                      raise SystemExit('Unexpected entry in audit frontend archive: '+p)
                  if info.file_size > 200000:
                      raise SystemExit('Unexpected large ZIP entry: '+p)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(z.read(info))
                  restored.append(p)
          required = {'apps/web/app/app/admin/tasks/page.tsx', 'apps/web/components/tasks/aggregate-task-list.tsx', 'apps/web/lib/api/tasks.ts'}
          if not required.issubset(restored):
              raise SystemExit('Frontend archive incomplete: missing '+str(required-set(restored)))
          print('Restored', len(restored), 'frontend files')
          PY
      - name: Install dependencies and format restored sources
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write "apps/api/src/tasks/{tasks.controller.ts,tasks.module.ts,tasks.service.ts,tasks.service.spec.ts,dto/task.dto.ts}" "apps/web/**/*.{ts,tsx}" "docs/audit/*.md"
      - name: Commit integrated source
        run: |
          git config user.name "pgs-audit-bot"
          git config user.email "pgs-audit-bot@users.noreply.github.com"
          git add apps/api/src/tasks apps/web docs/audit
          git rm -f web.zip
          git rm -f .github/workflows/restore-audit-web.yml
          git commit -m "fix(audit): integrate archived frontend and format audited sources"
          git push origin HEAD:refs/heads/feat/pgs-audit-ux-uat
